on:
  workflow_call:
    # No inputs

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - uses: actions/checkout@v4

    - name: Lint with flake8
      run: |
        # Use default setup.cfg
        flake8 .
